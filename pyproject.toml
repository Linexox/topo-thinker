[project]
name = "topothinker"
version = "0.1.0"
description = "A graph-structured AI conversation system powered by Reflex and Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reflex>=0.6.4",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",  # For graph data structure manipulation
    "reflex-chakra>=0.8.2.post1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topothinker"]
